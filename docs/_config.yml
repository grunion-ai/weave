# GitHub Pages configuration for the docs/ site.
# Only this folder is published; the repo root is not.
title: "weave: self-hosted work database for people and AI agents"
tagline: Tables, relations, boards, forms and documents in one SQLite file
description: >-
  Open-source, self-hosted work database for people and AI agents: connected
  tables, kanban boards, forms and markdown documents in one SQLite file. MIT.
theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag       # <title>, meta description, Open Graph, JSON-LD
  - jekyll-sitemap       # /sitemap.xml for crawlers
  - jekyll-relative-links # rewrites relative .md links to their .html pages
lang: en
author: Grunion AI
defaults:
  - scope:
      path: ""
    values:
      image: /social-preview.png
exclude:
  - screenshots/README.md
