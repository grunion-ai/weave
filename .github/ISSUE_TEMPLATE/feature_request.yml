name: Feature request
description: Suggest something weave should be able to do
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        weave is small on purpose. Proposals that add a runtime dependency, a
        build step, or a hosted component are out of scope by design — see
        [CONTRIBUTING.md](https://github.com/grunion-ai/weave/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that weave makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: The behavior you have in mind — a field type, a view, an API, a tool.
  - type: dropdown
    id: audience
    attributes:
      label: Who is it for
      multiple: true
      options:
        - People using the web UI
        - Agents (MCP / REST / CLI)
        - Self-hosters and operators
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Including how another tool (Airtable, Fibery, NocoDB, Grist…) handles it, if relevant.
