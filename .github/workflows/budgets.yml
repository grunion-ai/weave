name: budgets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.62.1"

jobs:
  trend:
    name: Timing budgets (trend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Runner image
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/weave-apt
          key: apt-${{ steps.image.outputs.version }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit
      - name: Install browsers and system dependencies
        timeout-minutes: 14
        run: node scripts/ci/install-browsers.mjs chromium webkit
      - name: Series from the earlier budget runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow budgets.yml --branch main --event push --status completed --limit 6 --json databaseId -q '.[].databaseId' || true)
          for run in $runs; do
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n trend-series -D "trend-history/$run" || echo "run $run kept no trend series"
          done
          echo "series: $(find trend-history -name '*.json' 2>/dev/null | wc -l) earlier points"
      - name: Run the timing budgets and judge the trend
        env:
          WEAVE_TREND_HISTORY: trend-history
          WEAVE_TREND_SERIES: trend-series
          WEAVE_TRACKER_TOKEN: ${{ secrets.WEAVE_TRACKER_TOKEN }}
          SHERIFF_ALERT_URL: ${{ secrets.SHERIFF_ALERT_URL }}
          SHERIFF_ALERT_TOKEN: ${{ secrets.SHERIFF_ALERT_TOKEN }}
        run: node scripts/ci-trend.mjs
      - name: Keep this run's readings for the next runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trend-series
          path: trend-series/
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
