name: budgets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.62.1"

jobs:
  trend:
    name: Timing budgets (trend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install browsers and system dependencies
        timeout-minutes: 11
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\nDPkg::Lock::Timeout "180";\n' | sudo tee /etc/apt/apt.conf.d/99weave-apt > /dev/null
          if timeout 5m npx --no-install playwright install --with-deps chromium webkit; then exit 0; fi
          sudo dpkg --configure -a || true
          timeout 5m npx --no-install playwright install --with-deps chromium webkit
      - name: Run the timing budgets and judge the trend
        env:
          GH_TOKEN: ${{ github.token }}
          SHERIFF_ALERT_URL: ${{ secrets.SHERIFF_ALERT_URL }}
          SHERIFF_ALERT_TOKEN: ${{ secrets.SHERIFF_ALERT_TOKEN }}
        run: node scripts/ci-trend.mjs
