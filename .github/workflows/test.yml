name: tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - name: Verify cloud promotion evidence
        run: node scripts/cloud-ci-evidence.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUD_CI_ORIGIN: ${{ vars.CLOUD_CI_ORIGIN }}
          CLOUD_CI_IMAGE: ${{ vars.CLOUD_CI_IMAGE }}
          CLOUD_CI_REVISION: ${{ vars.CLOUD_CI_REVISION }}

  release:
    name: Release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
