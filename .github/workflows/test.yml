name: tests
run-name: ${{ inputs.ref && format('tests at {0}', inputs.ref) || '' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to test in place of the dispatched branch head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.62.1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Recorded durations from the last green main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -p 'ci-*' -D ci-history || echo "run $run kept no readable shard results"
          else
            echo "no green main tests run to read durations from"
          fi
          echo "durations: $(find ci-history -name '*.json' 2>/dev/null | wc -l) shard results; every file without one is weighed by byte size"
      - name: Hand the same durations to every job of this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-history
          path: ci-history/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - id: plan
        env:
          WEAVE_CI_HISTORY: ci-history
        run: echo "matrix=$(node scripts/ci-test.mjs plan)" >> "$GITHUB_OUTPUT"

  test:
    name: tests ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - if: matrix.lane == 'browser'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Runner image
        id: image
        if: matrix.lane == 'browser'
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - if: matrix.lane == 'browser'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/weave-apt
          key: apt-${{ steps.image.outputs.version }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit
      - name: Install browsers and system dependencies
        if: matrix.lane == 'browser'
        timeout-minutes: 14
        run: node scripts/ci/install-browsers.mjs chromium webkit
      - name: Durations the plan job used
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n plan-history -D ci-history || echo "this run recorded no durations; the plan weighed by byte size"
      - name: Run complete shard
        env:
          SHARD: ${{ matrix.id }}
          WEAVE_TEST_QUEUE_WAIT_MS: "60000"
          WEAVE_CI_HISTORY: ci-history
        run: node scripts/ci-test.mjs run "$SHARD"
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.id }}-${{ github.run_attempt }}
          path: ci-results/*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$PLAN_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*
          path: ci-results
      - name: Durations the plan job used
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n plan-history -D ci-history || echo "this run recorded no durations; the plan weighed by byte size"
      - name: Verify exact commit and complete executed coverage
        env:
          WEAVE_CI_HISTORY: ci-history
        run: node scripts/ci-test.mjs aggregate ci-results

  compatibility:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.ref)
    name: compatibility node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-latest]
        node: ["22.16", "24.12.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm test -- --test-concurrency=2
