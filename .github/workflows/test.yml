name: tests
run-name: ${{ inputs.ref && format('tests at {0}', inputs.ref) || '' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to test in place of the dispatched branch head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.62.1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Read file timings from the newest green main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timings.mjs "$RUNNER_TEMP/ci-timings.json"
      - id: plan
        env:
          CI_TIMINGS: ${{ runner.temp }}/ci-timings.json
          CI_MANIFEST: ci-plan/manifest.json
        run: echo "matrix=$(node scripts/ci-test.mjs plan)" >> "$GITHUB_OUTPUT"
      - name: Keep the plan for the shards and the gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-manifest
          path: ci-plan/manifest.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: tests ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - if: matrix.lane == 'browser'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install browsers and system dependencies
        if: matrix.lane == 'browser'
        timeout-minutes: 11
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\nDPkg::Lock::Timeout "180";\n' | sudo tee /etc/apt/apt.conf.d/99weave-apt > /dev/null
          if timeout 5m npx --no-install playwright install --with-deps chromium webkit; then exit 0; fi
          sudo dpkg --configure -a || true
          timeout 5m npx --no-install playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan-manifest
          path: ci-plan
      - name: Run complete shard
        env:
          SHARD: ${{ matrix.id }}
          CI_MANIFEST: ci-plan/manifest.json
          WEAVE_TEST_QUEUE_WAIT_MS: "60000"
        run: node scripts/ci-test.mjs run "$SHARD"
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.id }}-${{ github.run_attempt }}
          path: ci-results/*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$PLAN_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*
          path: ci-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan-manifest
          path: ci-plan
      - name: Verify exact commit and complete executed coverage
        env:
          CI_MANIFEST: ci-plan/manifest.json
        run: node scripts/ci-test.mjs aggregate ci-results

  compatibility:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.ref)
    name: compatibility node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.16", "24.12.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm test -- --test-concurrency=2
