name: tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSION: "1.62.1"

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - id: plan
        run: echo "matrix=$(node scripts/ci-test.mjs plan)" >> "$GITHUB_OUTPUT"

  test:
    name: tests ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install browsers and system dependencies
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run complete shard
        env:
          SHARD: ${{ matrix.id }}
          WEAVE_TEST_QUEUE_WAIT_MS: "60000"
        run: node scripts/ci-test.mjs run "$SHARD"
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.id }}
          path: ci-results/*.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$PLAN_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*
          path: ci-results
      - name: Verify exact commit and complete executed coverage
        run: node scripts/ci-test.mjs aggregate ci-results

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: compatibility node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.16", "24.12.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm test -- --test-concurrency=2

  release:
    name: Release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
