name: sheriff

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Main push tests run ID to judge
        required: true
        type: string
      dry_run:
        description: Read GitHub and print the plan without writing anything
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sheriff-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  sheriff:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - name: Judge the red run
        run: node scripts/sheriff.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SHERIFF_TOKEN: ${{ secrets.SHERIFF_TOKEN }}
          WEAVE_TRACKER_TOKEN: ${{ secrets.WEAVE_TRACKER_TOKEN }}
          SHERIFF_ALERT_URL: ${{ secrets.SHERIFF_ALERT_URL }}
          SHERIFF_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SHERIFF_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
