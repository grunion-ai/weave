name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - name: Recorded durations from the last green main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -p 'ci-*' -D ci-history || echo "run $run kept no readable shard results"
          else
            echo "no green main tests run to read durations from"
          fi
          echo "durations: $(find ci-history -name '*.json' 2>/dev/null | wc -l) shard results; every file without one is weighed by byte size"
      - name: Hand the same durations to every job of this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-history
          path: ci-history/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - id: plan
        env:
          WEAVE_CI_HISTORY: ci-history
        run: echo "matrix=$(node scripts/ci-test.mjs pr-plan)" >> "$GITHUB_OUTPUT"

  test:
    name: pr ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ matrix.lane == 'browser' && 'mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' || '' }}
      options: --user 1001 --ipc=host --init --add-host net.localhost:127.0.0.1 --add-host bandito.localhost:127.0.0.1 --add-host scratch.localhost:127.0.0.1
      volumes:
        - /usr/share/fonts:/usr/local/share/fonts/runner:ro
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix .github/test-tools
          ln -s .github/test-tools/node_modules node_modules
      - name: Durations the plan job used
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: plan-history
          path: ci-history
          merge-multiple: true
      - name: Run fast shard
        env:
          SHARD: ${{ matrix.id }}
          WEAVE_TEST_QUEUE_WAIT_MS: "60000"
          WEAVE_CI_HISTORY: ci-history
        run: node scripts/ci-test.mjs pr-run "$SHARD"
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-${{ matrix.id }}-${{ github.run_attempt }}
          path: ci-results/*.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: PR gate
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$PLAN_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pr-*
          path: ci-results
      - name: Durations the plan job used
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: plan-history
          path: ci-history
          merge-multiple: true
      - name: Verify exact commit and complete executed coverage
        env:
          WEAVE_CI_HISTORY: ci-history
        run: node scripts/ci-test.mjs pr-aggregate ci-results
