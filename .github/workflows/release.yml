name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main push tests run ID with a successful CI gate
        required: true
        type: string
      historical:
        description: Recover a tested main ancestor without changing latest
        type: boolean
        default: false
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      current: ${{ steps.guard.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: guard
        run: node scripts/github-release.mjs --guard
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL: ${{ github.event_name == 'workflow_dispatch' && inputs.historical }}
          CI_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  publish:
    needs: guard
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      state: ${{ steps.publish.outputs.state }}
    if: needs.guard.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: release-tools
          fetch-depth: 0
          persist-credentials: false
      - id: publish
        run: node release-tools/scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL: ${{ github.event_name == 'workflow_dispatch' && inputs.historical }}
          CI_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

  image:
    needs: [guard, publish]
    if: needs.publish.outputs.sha != '' && (needs.publish.outputs.state == 'published' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ghcr.io/grunion-ai/weave:${{ steps.version.outputs.version }}
            ${{ !inputs.historical && 'ghcr.io/grunion-ai/weave:latest' || '' }}
          labels: |
            io.modelcontextprotocol.server.name=io.github.grunion-ai/weave
            org.opencontainers.image.source=https://github.com/grunion-ai/weave
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.publish.outputs.sha }}
            org.opencontainers.image.licenses=MIT

  registry:
    needs: [guard, publish, image]
    if: needs.publish.outputs.sha != '' && (needs.publish.outputs.state == 'published' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
