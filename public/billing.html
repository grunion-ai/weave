<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · weave</title>
<link rel="icon" type="image/svg+xml" href="/brand/weave-favicon.svg">
<link rel="alternate icon" href="/brand/favicon.ico">
<style>
  :root { --fs-h1: 24px; --fs-body: 15px; --fs-small: 13px; --bg: #eceff3; --card: #ffffff; --fg: #1d273b; --muted: #5f6474; --line: #dce1e7; --ok: #2b8a3e; --bad: #c92a2a; --accent: #206bc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --fg: #dce1e7; --muted: #8a97ab; --line: #2c3340; --ok: #69db7c; --bad: #ff8787; --accent: #4dabf7; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: var(--fs-body)/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 8vh auto; padding: 0 16px; }
  h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
  .muted { color: var(--muted); }
  .seats { list-style: none; margin: 0; padding: 0; }
  .seats li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 2px; }
  .seats li + li { border-top: 1px solid var(--line); }
  .seats small { color: var(--muted); font-size: var(--fs-small); }
  .seats .seat-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .seats .seat-mail { overflow-wrap: anywhere; }
  .state-ok { color: var(--ok); }
  .state-bad { color: var(--bad); }
  .btn { display: inline-block; padding: 7px 16px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .btn[disabled] { opacity: .5; cursor: default; }
  #checkout:empty { display: none; }
  .foot { margin-top: 16px; font-size: var(--fs-small); }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Billing</h1>
  <p class="muted" id="summary">Loading the plan…</p>
  <section class="card" aria-labelledby="seats-h">
    <strong id="seats-h">Seats</strong>
    <p class="muted">Editors and Architects take a paid seat. Observers read and comment for free.</p>
    <ul class="seats" id="seats"></ul>
  </section>
  <section class="card" id="team" hidden>
    <p id="team-why"></p>
    <button class="btn" id="team-open" type="button">Open the team plan</button>
  </section>
  <section class="card" id="checkout"></section>
  <p class="foot"><a id="back" href="/">Back to the workspace</a></p>
</main>
<script src="/billing.js" type="module"></script>
</body>
</html>
