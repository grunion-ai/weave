<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up weave</title>
<link rel="icon" href="/brand/weave-favicon.svg">
<style>
  :root {
    --canvas: #eceff3; --panel: #ffffff; --sunk: #e2e6ec; --line: #d9dee6;
    --ink: #24292e; --body: #374151; --muted: #6b7280;
    --accent: #3a5bc7; --accent-ink: #fff; --bad: #ce2c31; --bad-soft: rgba(229,72,77,.12); --ok: #218358; --ok-soft: rgba(46,160,67,.14);
    --strand-a: #2563eb; --strand-b: #0c1b33;
    --app: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0f1115; --panel: #181b21; --sunk: #222731; --line: #2a2f38;
      --ink: #e6e8ec; --body: #c9ced6; --muted: #8b93a1;
      --accent: #9eb1ff; --accent-ink: #0c1b33; --bad: #ff9ea1; --bad-soft: rgba(229,72,77,.18); --ok: #71d083; --ok-soft: rgba(70,180,110,.16);
      --strand-a: #2563eb; --strand-b: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--body); font: 15px/1.5 var(--app); -webkit-font-smoothing: antialiased; }
  .setup { min-height: 100%; display: grid; grid-template-columns: minmax(380px, 520px) minmax(0, 1fr); }
  .pane { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 100vh; padding: 28px 40px 20px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 20px; letter-spacing: -.02em; }
  .brand svg { width: 34px; height: 34px; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 26px 0 0; }
  .donut { width: 52px; height: 52px; flex: none; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 5; stroke-linecap: round; }
  .donut .track { stroke: var(--line); }
  .donut .fill.a { stroke: var(--strand-a); }
  .donut .fill.b { stroke: var(--strand-b); }
  .donut .pct { transform: rotate(90deg); transform-origin: 26px 26px; fill: var(--ink); font: 600 11px var(--app); font-variant-numeric: tabular-nums; }
  .progress-text { display: flex; flex-direction: column; line-height: 1.3; }
  .progress-of { color: var(--muted); font-size: 12.5px; }
  .progress-name { color: var(--ink); font-size: 15px; font-weight: 600; }
  main { flex: 1; padding: 28px 0 12px; }
  h1 { color: var(--ink); font-size: 26px; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 8px; }
  main h2 { color: var(--ink); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
  .lead { margin: 0 0 20px; color: var(--body); }
  .muted { color: var(--muted); font-size: 13.5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: default; filter: none; }
  .btn-wide { width: 100%; }
  .btn-link { padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13.5px; text-decoration: underline; cursor: pointer; }
  .btn-link:hover { color: var(--ink); }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
  .actions .grow { flex: 1; }
  .form-label { display: block; font-weight: 600; color: var(--ink); margin: 14px 0 4px; }
  .form-control { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .form-control:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .form-control[aria-invalid="true"] { border-color: var(--bad); }
  .form-hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .ws-slug-status[data-state="available"] { color: var(--ok); }
  .ws-slug-status[data-state="taken"], .ws-slug-status[data-state="reserved"], .ws-slug-status[data-state="invalid"] { color: var(--bad); }
  .ws-slug-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .ws-slug-chips[hidden] { display: none; }
  .ws-slug-chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 14px; margin: 0 0 16px; }
  .alert .grow { flex: 1; }
  .alert.note { background: var(--sunk); color: var(--body); }
  .glyph { display: inline-block; width: 18px; height: 18px; flex: none; background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .tile { box-sizing: content-box; width: 18px; height: 18px; padding: 7px; border-radius: 8px; background: var(--sunk); background-clip: content-box; }
  .card .tile { color: var(--accent); background: none; box-shadow: inset 0 0 0 32px var(--sunk); -webkit-mask: none; mask: none; position: relative; }
  .card .tile::after { content: ""; position: absolute; inset: 7px; background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .search { position: relative; margin: 0 0 12px; scroll-margin-top: 12px; }
  .search .glyph { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--muted); pointer-events: none; }
  .search .form-control { padding-left: 36px; font-size: 16px; }
  .no-match { margin: 0 0 8px; }
  .fallback { margin-top: 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -40px 14px; padding: 2px 40px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--body); font: inherit; font-size: 13.5px; cursor: pointer; }
  .chip .glyph { width: 14px; height: 14px; color: var(--muted); }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .chip[aria-pressed="true"] .glyph { color: var(--panel); }
  .shelf + .shelf { margin-top: 6px; }
  .gallery.one .shelf:not(.fallback) h2 { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .card { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--body); font: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--muted); }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .card-text b, .app-text b { display: block; color: var(--ink); font-weight: 600; }
  .card-text small, .app-text small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .details { grid-column: 1 / -1; position: relative; margin: 4px 0 6px; padding: 14px 16px; border-radius: 10px; background: var(--sunk); animation: rise .22s ease-out; }
  .details::before { content: ""; position: absolute; top: -6px; left: var(--notch, 25%); width: 12px; height: 12px; margin-left: -6px; background: var(--sunk); transform: rotate(45deg); border-radius: 2px; }
  .details:empty { display: none; }
  .details-lead { margin: 0 0 10px; color: var(--ink); }
  .tables { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .tables li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--panel); }
  .tables .glyph { width: 16px; height: 16px; margin-top: 2px; color: var(--accent); }
  .tables b { display: block; color: var(--ink); font-size: 14px; }
  .tables small { display: block; color: var(--muted); font-size: 12.5px; }
  .details-count { margin: 0; }
  .details .form-control { background: var(--panel); }
  .actions.sticky { position: sticky; bottom: 0; z-index: 2; margin: 18px -40px 0; padding: 12px 40px; background: var(--panel); border-top: 1px solid var(--line); }
  .switch { margin: 14px 0 0; font-size: 14px; color: var(--body); }
  .btn-link.strong { color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
  .btn-link.strong:hover { text-decoration: underline; color: var(--accent); }
  .bypass { margin-top: 22px; }
  .apps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .limits { margin: 16px 0 0; font-size: 12.5px; }
  .copybox pre.prompt { max-height: 11.5em; overflow: auto; font: 13px/1.5 var(--app); word-break: normal; overflow-wrap: anywhere; }
  .app { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: inherit; color: var(--body); cursor: pointer; transition: border-color .15s, transform .15s; }
  .app:hover { border-color: var(--muted); transform: translateY(-1px); }
  .app:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app-tile { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 10px; color: var(--hue); background: color-mix(in srgb, var(--hue) 14%, var(--panel)); }
  .app-tile .glyph { width: 20px; height: 20px; }
  .app-tile.big { width: 48px; height: 48px; border-radius: 13px; }
  .app-tile.big .glyph { width: 26px; height: 26px; }
  .weave-tile { background: var(--sunk); }
  .weave-tile svg { width: 30px; height: 30px; }
  .chosen { display: flex; align-items: center; gap: 14px; padding: 0 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .chosen-text { flex: 1; }
  .chosen-text b { display: block; color: var(--ink); font-size: 22px; line-height: 1.2; letter-spacing: -.01em; }
  .chosen-text small { color: var(--muted); font-size: 13.5px; }
  .steps { list-style: none; counter-reset: step; margin: 0 0 6px; padding: 0; }
  .steps li { counter-increment: step; position: relative; padding: 0 0 16px 38px; }
  .steps li::before { content: counter(step); position: absolute; left: 0; top: -1px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); color: var(--ink); font-size: 12.5px; font-weight: 600; }
  .steps li::after { content: ""; position: absolute; left: 11.5px; top: 27px; bottom: 3px; width: 1px; background: var(--line); }
  .steps li:last-child::after { display: none; }
  .steps li[data-at]::before { background: var(--accent); color: var(--accent-ink); }
  .step-text { display: block; color: var(--body); }
  .step-action { display: grid; gap: 8px; margin-top: 10px; justify-items: start; }
  .copybox { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 14px; }
  .copybox code, .copybox pre { flex: 1; min-width: 0; margin: 0; padding: 9px 11px; border-radius: 8px; background: var(--sunk); color: var(--ink); font: 13px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .copybox .message { font: 14px/1.5 var(--app); word-break: normal; overflow-wrap: anywhere; }
  .copybox .btn { min-height: 0; padding: 6px 14px; font-size: 13.5px; white-space: nowrap; }
  .copybox .btn[data-copied] { background: var(--ok); border-color: var(--ok); color: var(--panel); }
  .step-action .copybox { width: 100%; margin: 0; }
  .note { margin: 0 0 16px 38px; }
  .link { margin: 4px 0 18px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; text-align: center; }
  .link-ends { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 10px; }
  .wire { position: relative; width: 120px; height: 2px; margin: 0 6px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
  .pulse { position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--strand-a); box-shadow: 0 0 0 4px color-mix(in srgb, var(--strand-a) 18%, transparent); animation: travel 1.8s cubic-bezier(.45, 0, .55, 1) infinite; }
  .check { position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--ok); opacity: 0; transform: scale(.4); }
  .check::after { content: ""; position: absolute; left: 9px; top: 5px; width: 6px; height: 11px; border: solid var(--panel); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .link[data-state="connected"] { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
  .link[data-state="connected"] .wire { background: var(--ok); animation: grow .45s ease-out; }
  .link[data-state="connected"] .pulse { display: none; }
  .link[data-state="connected"] .check { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) .25s forwards; }
  .link[data-state="waiting"] .app-tile:last-child { animation: breathe 1.8s ease-in-out infinite; }
  .link-text { margin: 0; color: var(--body); font-size: 14px; }
  .link[data-state="connected"] .link-text { color: var(--ok); font-weight: 600; font-size: 15px; }
  .link-sub { margin: 2px 0 0; }
  .payoff { margin: 0 0 4px; padding: 16px; border-radius: 12px; background: var(--sunk); opacity: .72; transition: opacity .3s; }
  .payoff[data-ready] { opacity: 1; background: color-mix(in srgb, var(--accent) 9%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); animation: rise .4s ease-out .2s both; }
  .payoff h2 { margin: 0 0 2px; color: var(--ink); font-size: 15px; text-transform: none; letter-spacing: 0; }
  .payoff p { margin: 0 0 10px; }
  .copybox.stacked { flex-direction: column; align-items: stretch; }
  .copybox.stacked .btn { align-self: flex-start; }
  .payoff .copybox code { background: var(--panel); }
  .trial { margin-top: 14px; text-align: center; }
  @keyframes travel { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 8px); opacity: 0; } }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes breathe { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--hue) 16%, transparent); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .rows { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
  .rows li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows a { color: var(--ink); text-decoration: none; font-weight: 600; flex: 1; }
  .rows a:hover { color: var(--accent); }
  .rows small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { display: flex; gap: 10px; align-items: center; padding: 5px 0; color: var(--muted); }
  .checklist li[data-done] { color: var(--ink); }
  .checklist li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .checklist li[data-done]::before { border-color: var(--ok); background: var(--ok); }
  .pane-foot { font-size: 12.5px; color: var(--muted); }
  .pane-foot a { color: var(--muted); }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .radiate, .radiate img { display: block; width: 100%; height: 100%; }
  .radiate img { object-fit: cover; object-position: center; }
  .strand.a { stroke: var(--strand-a); }
  .strand.b { stroke: var(--strand-b); }
  .strand.halo { stroke: var(--canvas); stroke-width: 7; }
  .strand.cross { stroke-dasharray: .4 .6; stroke-dashoffset: -.3; }
  .strand { fill: none; stroke-width: 3.5; stroke-linecap: round; }
  .weave-tile .strand.halo { stroke: var(--sunk); }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .details, .payoff[data-ready], .link .app-tile, .link[data-state="connected"] .wire { animation: none !important; }
    .link[data-state="connected"] .check { animation: none; opacity: 1; transform: none; }
    .app, .card { transition: none; }
  }
  @media (max-width: 860px) {
    .setup { grid-template-columns: minmax(0, 1fr); }
    .stage { display: none; }
    .pane { min-height: 100vh; border-right: 0; padding: 20px 20px 16px; }
    .chips { margin: 0 -20px 14px; padding: 2px 20px 4px; }
    .actions.sticky { margin: 18px -20px 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
    .wire { width: 84px; }
    .pane:has(#work-search:focus) .actions.sticky { position: static; }
  }
  @media (max-width: 420px) {
    .cards { grid-template-columns: minmax(0, 1fr); }
  }
</style>
<script src="/slug-core.js"></script>
<script src="/slug-form.js"></script>
<script src="/starter-core.js"></script>
<script src="/setup-core.js"></script>
<script src="/agent-connect-core.js"></script>
<script src="/start.js" defer></script>
</head>
<body>
<div class="setup">
  <section class="pane">
    <a class="brand" href="/start" aria-label="weave"><svg viewBox="8 12 32 24" aria-hidden="true" id="brand-mark"></svg>weave</a>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Setup progress" hidden></div>
    <main id="start" aria-live="polite"></main>
    <footer class="pane-foot"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
  </section>
  <aside class="stage" id="stage"></aside>
</div>
</body>
</html>
