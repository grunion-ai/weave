<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weave</title>
<link rel="icon" href="/brand/weave-favicon.svg">
<style>
  :root { --bg: #f6f8fb; --card: #fff; --fg: #1d273b; --muted: #667085; --line: #dce1e7; --ok: #2b8a3e; --bad: #c92a2a; --accent: #206bc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151f2c; --card: #1b2636; --fg: #dce1e7; --muted: #8a97ab; --line: #2c3a4f; --ok: #69db7c; --bad: #ff8787; --accent: #4dabf7; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 10vh auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows a { display: block; padding: 10px 2px; color: var(--fg); text-decoration: none; font-weight: 600; }
  .rows a:hover, .rows a:focus-visible { color: var(--accent); outline: none; }
  .rows small { display: block; font-weight: 400; color: var(--muted); }
  .muted { color: var(--muted); }
  .btn { display: inline-block; padding: 7px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .form-label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .form-control { box-sizing: border-box; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; }
  .form-control[aria-invalid="true"] { border-color: var(--bad); }
  .form-hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .ws-slug-status[data-state="available"] { color: var(--ok); }
  .ws-slug-status[data-state="taken"], .ws-slug-status[data-state="reserved"], .ws-slug-status[data-state="invalid"] { color: var(--bad); }
  .ws-slug-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .ws-slug-chips[hidden] { display: none; }
  .ws-slug-chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .foot { margin-top: 16px; font-size: 13px; }
  .foot a { color: var(--muted); }
</style>
<script src="/slug-core.js"></script>
<script src="/slug-form.js"></script>
<script src="/start.js" defer></script>
</head>
<body>
<main id="start" aria-live="polite"></main>
</body>
</html>
