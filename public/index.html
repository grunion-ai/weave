<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave</title>
<link rel="stylesheet" href="/vendor/tabler.min.css">
<link rel="stylesheet" href="/vendor/vditor/dist/index.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/brand/weave-favicon.svg">
<link rel="alternate icon" href="/brand/favicon.ico">
</head>
<body>
<div id="app">
  <nav id="ws-rail" aria-label="Workspaces">
    <a id="rail-weave" class="ws-icon ws-weave" href="/w/weave/" title="weave — docs, roadmap &amp; issues">
      <img class="mark-light" src="/brand/weave-mark-light.svg" alt="weave">
      <img class="mark-dark" src="/brand/weave-mark-dark.svg" alt="weave">
    </a>
    <button id="nav-expand" class="hidden" title="Expand sidebar" type="button">›</button>
    <div id="ws-list"></div>
    <button id="ws-new" class="ws-icon ws-new" title="New workspace" type="button">+</button>
    <span class="rail-spacer"></span>
    <button id="theme-toggle" class="ws-icon" title="Theme: auto" type="button"></button>
  </nav>
  <aside id="sidebar">
    <div class="brand">
      <a id="ws-name" class="ws-wordmark" href="/" title="Open the workspace page"></a>
      <button id="nav-collapse" class="btn btn-sm btn-icon btn-ghost-secondary tiny" title="Collapse sidebar" type="button">‹</button>
    </div>
    <button id="search-btn" class="search-like" type="button">
      <span class="search-label">Search…</span><kbd>⌘K</kbd>
    </button>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
  <!-- Page loader. A sibling of <main>, not a child, so a page render's
       replaceChildren() cannot wipe it mid-wait. Filled by initPageLoader()
       with both themed ropes inlined — inline SVG, because only that exposes
       the clock control that makes "finish the cycle" exact. -->
  <div id="page-loader" hidden aria-hidden="true"></div>
</div>
<script src="/vendor/vditor/dist/index.min.js"></script>
<script src="/nl-date.js"></script>
<script src="/date-core.js"></script>
<script src="/breadcrumbs.js"></script>
<script src="/chip-core.js"></script>
<script src="/bug-core.js"></script>
<script src="/picker-core.js"></script>
<script src="/field-dialog-core.js"></script>
<script src="/graph-parse.js"></script>
<script src="/relmap-layout.js"></script>
<script src="/vendor/iconly-flat.js"></script>
<script src="/mark-icons.js"></script>
<script type="module">import * as leanQR from "/vendor/lean-qr.mjs"; window.leanQR = leanQR;</script>
<script src="/editor-lib.js"></script>
<script src="/app.js"></script>
</body>
</html>
