<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🕸️&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
<div id="app">
  <nav id="ws-rail" aria-label="Workspaces"></nav>
  <aside id="sidebar">
    <div class="brand">🕸️ <strong>Weave</strong>
      <span id="ws-name" class="ws-name"></span>
    </div>
    <button id="search-btn" class="search-like" type="button">
      <span class="search-label">Search…</span><kbd>⌘K</kbd>
    </button>
    <nav id="nav"></nav>
    <div class="sidebar-actions">
      <button id="add-space" class="ghost">+ Space</button>
      <button id="add-db" class="ghost">+ Table</button>
      <span style="flex:1"></span>
      <button id="theme-toggle" class="ghost" title="Theme: auto"></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
