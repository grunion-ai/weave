# docker compose up -d   →   http://127.0.0.1:4400
# One service, one named volume, one replica: weave is a single SQLite writer.
# Put a front door in front of the published port before exposing it — see
# the Handbook guide "Self-host weave: choose your door".
services:
  weave:
    build: .
    image: weave:local
    restart: unless-stopped
    ports:
      - "4400:4400"
    volumes:
      - weave-data:/data
    environment:
      PORT: 4400
      WEAVE_HOST: 0.0.0.0
      WEAVE_DATA: /data/workspace.db
      WEAVE_KEYSTORE: /data/keystore.json
      # Set this and no key file lands on the volume (Handbook → "Environment reference").
      # WEAVE_KEYSTORE_PASSPHRASE: change-me
      # Sign-in (Handbook → "Door C: sign in with a provider"): the origin browsers
      # use, and 1 when a reverse proxy sits in front so rate limits see the client.
      # WEAVE_ORIGIN: https://weave.example.com
      # WEAVE_TRUST_PROXY: "1"
      # Set this (plus the bucket credentials — Handbook → "Backup and restore")
      # and the server backs itself up nightly at 04:00 UTC, thirty archives kept.
      # WEAVE_BACKUP_DEST: s3://bucket/weave
      # Sign in with one OpenID Connect provider (Handbook → "Door C: sign in
      # with a provider"); its redirect URI is <WEAVE_ORIGIN>/api/auth/oidc/callback.
      # WEAVE_OIDC_ISSUER: https://clerk.example.com
      # WEAVE_OIDC_CLIENT_ID: change-me
      # WEAVE_OIDC_CLIENT_SECRET: change-me
      # WEAVE_OIDC_NAME: Clerk
      # The server asks GitHub for the latest release once a day; off stops it.
      # WEAVE_UPDATE_CHECK: "off"
      # With command ["node", "bin/weave.js", "supervise"], 1 installs each newer
      # release from grunion-ai/weave main in place (Handbook → "Deploy: Railway").
      # WEAVE_AUTO_UPDATE: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  weave-data:
